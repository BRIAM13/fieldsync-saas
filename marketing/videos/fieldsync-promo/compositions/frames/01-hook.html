        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
        }
        /* full-bleed ground on a clip layer, never on #root */
        .hook-bg {
          position: absolute;
          inset: 0;
          background: #fdfae7;
        }
        .hook-diagonal {
          position: absolute;
          inset: 0;
          background: rgba(30, 43, 250, 0.08);
          clip-path: polygon(64% 0, 100% 0, 100% 100%, 78% 100%);
        }
        .hook-dots {
          position: absolute;
          right: 6cqw;
          top: 10cqw;
          width: 12cqw;
          height: 12cqw;
          background-image: radial-gradient(rgba(30, 43, 250, 0.35) 1.4px, transparent 1.6px);
          background-size: 4cqw 4cqw;
          opacity: 0.9;
        }
        .hook-content {
          position: absolute;
          left: 8cqw;
          top: 36cqh;
          width: 60cqw;
        }
        .hook-accent {
          width: 60px;
          height: 4px;
          border-radius: 2px;
          background: #1e2bfa;
          transform-origin: left center;
        }
        .hook-eyebrow {
          margin-top: 2.2cqw;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 1.05cqw;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #1e2bfa;
        }
        .hook-title {

          font-weight: 700;
          font-size: 7cqw;
          letter-spacing: -0.02em;
          line-height: 1.0;
          color: #111111;
        }
        .hook-sub {
          margin-top: 2cqw;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 500;
          font-size: 2cqw;
          letter-spacing: -0.01em;
          color: #6b6b6b;
        }
        .hook-progress {
          position: absolute;
          left: 0;
          bottom: 0;
          height: 3px;
          background: #1e2bfa;
        }
      </style>
