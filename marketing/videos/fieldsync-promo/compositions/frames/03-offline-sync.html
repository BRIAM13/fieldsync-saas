      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#off-eyebrow", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.1);
        tl.fromTo("#off-pill", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.35);
        tl.fromTo("#off-h2", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.4);
        tl.fromTo(".off-phone", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.3);

        // signal drops → slash appears, signal bars dim (offline)
        tl.fromTo("#off-slash", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.5);
        tl.fromTo(".off-signal span", { opacity: 1 }, { opacity: 0.25, duration: 0.3 }, 1.5);
        // pending badge appears while offline
        tl.fromTo("#off-badge", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.9);

        tl.fromTo("#off-highlight", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.0);

        // signal returns → slash off, bars restore, badge flips to synced
        tl.to("#off-slash", { opacity: 0, scaleX: 0, duration: 0.3, ease: "power2.in" }, 3.2);
        tl.to(".off-signal span", { opacity: 1, duration: 0.3 }, 3.2);
        // seek-safe text/color swap via zero-duration tl.set (never .call / onUpdate)
        tl.to("#off-badge", { opacity: 0, y: -6, duration: 0.25, ease: "power2.in" }, 3.4);
        tl.set("#off-badge", { textContent: "✓ sincronizado", backgroundColor: "rgba(5,150,105,0.2)", color: "#34d399" }, 3.66);
        tl.fromTo("#off-badge", { opacity: 0, y: 8, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 3.66);

        window.__timelines["03-offline-sync"] = tl;
      </script>
